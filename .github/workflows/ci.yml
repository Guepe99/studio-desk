name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev,agents]'  # tests/test_agents.py imports the Agent Framework
      # the seed build lets tests/test_replays.py check the committed packs (it fails, not skips, under CI)
      - run: python -m studiodesk.sim build --matches 4 --seed 7 && python -m studiodesk.facts build --all
      - run: pytest -q
      # the web tests read the exported packs: the seed build plus the committed agent output, as in the README
      - run: for m in M001 M002 M003 M004; do python -m studiodesk.export "$m"; done && cp -r replays/. web/data/
      - run: node --version && node --test tests/web/*.test.mjs
