name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12.3"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22.23.1"
      - run: pip install -c constraints.txt -e '.[dev,agents]'  # tests/test_agents.py imports the Agent Framework
      - run: ruff check studiodesk scripts tests examples
      # the seed build lets tests/test_replays.py check the committed packs (it fails, not skips, under CI)
      - run: python -m studiodesk.sim build --matches 4 --seed 7 && python -m studiodesk.facts build --all
      # tests/test_build_crowd_face.py decodes and encodes PNGs with ffmpeg, as scripts/build_crowd_face.py does
      - name: ffmpeg (apt)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg && ffmpeg -version | head -1
      - run: pytest -q
      # the web tests read the exported packs: the seed build plus the committed agent output, as in the README
      - run: for m in M001 M002 M003 M004; do python -m studiodesk.export "$m"; done && cp -r replays/. web/data/ && python scripts/make_demo_fixture.py
      - run: node --version && node --test tests/web/*.test.mjs
