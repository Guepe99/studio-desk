name: booth-render
# Renders the booth's Kokoro clips (docs/commentary.md) on hosted runners, one job per language and
# per clip set, with the same command as a local build. Each job uploads its clips and its manifest as
# an artifact; they are merged locally (docs/commentary.md, "Build on CI") and committed.
#   gh workflow run booth-render.yml && gh run download <run id> -D <dir>
# A manual run needs the workflow on the default branch; before the merge a push to feat/booth that
# changes this file starts it.
on:
  workflow_dispatch:
  push:
    branches: [feat/booth]
    paths: [.github/workflows/booth-render.yml]
permissions:
  contents: read
jobs:
  lineups:
    # meta.json of the four seed matches and DEMO, rebuilt from the seed as the image does (Dockerfile)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12.3"
          cache: pip
      - run: pip install -e .
      - run: |
          python -m studiodesk.sim build --matches 4 --seed 7 && python -m studiodesk.facts build --all
          for m in M001 M002 M003 M004; do python -m studiodesk.export "$m"; done
          python scripts/make_demo_fixture.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: lineups
          path: web/data/*/meta.json
  render:
    needs: lineups
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        lang: [en, it, es]
        what: [shared, M001, M002, M003, M004, DEMO]
    env:
      KOKORO_THREADS: "1"  # as the local build, so a clip can be compared both ways
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12.3"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: lineups
          path: web/data
      - name: ffmpeg (apt)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg && ffmpeg -version | head -1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            .tts/hf
            ~/.cache/pip
          key: kokoro-${{ hashFiles('scripts/booth-kokoro-setup.sh', 'scripts/booth-kokoro-requirements.txt') }}
      - run: scripts/booth-kokoro-setup.sh  # venv, model and voices, checked by SHA256
      - run: pip install -e .
      - run: python -m studiodesk.booth "${{ matrix.what }}" --lang "${{ matrix.lang }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: booth-${{ matrix.lang }}-${{ matrix.what }}
          if-no-files-found: error
          path: |
            web/booth/booth.json
            web/booth/${{ matrix.lang }}
            replays/*/booth.json
            replays/*/booth
            tests/web/booth-demo
