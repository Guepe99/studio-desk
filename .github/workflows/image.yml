name: image
# Builds only a main commit whose tests passed (the ci workflow), tagged with that commit's sha.
# A manual run needs a passing ci run on the same commit too. latest moves only to the commit that
# is the head of main when the run starts, and runs go one at a time, so an old commit never takes
# latest back.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  actions: read  # the ci runs of a commit, for a manual run
concurrency:
  group: image
  cancel-in-progress: false
jobs:
  build:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      REPO: ${{ github.repository }}
      IMAGE: ghcr.io/guepe99/studio-desk
    steps:
      - name: A passing ci run on this commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&status=success" --jq .total_count)
          if [ "$n" -lt 1 ]; then echo "::error::no passing ci run on $SHA"; exit 1; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ env.SHA }}
      - name: Tags (latest only for the head of main)
        id: tags
        run: |
          head=$(git ls-remote "https://github.com/$REPO" refs/heads/main | cut -f1)
          tags="$IMAGE:$SHA"
          if [ "$head" = "$SHA" ]; then tags="$tags,$IMAGE:latest"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
