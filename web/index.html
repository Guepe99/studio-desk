<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Studio Desk</title>
  <meta name="description" content="The AI production desk of a football broadcast, on a synthetic match.">
  <link rel="preload" href="vendor/fonts/urbanist/Urbanist-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/broadcast.css">
  <link rel="stylesheet" href="css/view3d.css">
  <link rel="stylesheet" href="css/ask.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main id="app">
    <header id="masthead">
      <h1>Studio Desk</h1>
      <p class="mh-match"><span id="mh-teams"></span><span id="mh-venue"></span><span class="mh-tag" data-i18n="replay">Replay</span></p>
      <p class="mh-sub" data-i18n="tagline">AI agents write the TV graphics for a football replay, and you decide what goes on air</p>
    </header>
    <div id="frame" role="region" aria-label="Match broadcast" data-i18n-aria="broadcast" tabindex="0">
      <canvas id="view3d" aria-hidden="true" tabindex="-1" inert></canvas>
      <div id="stage">
        <canvas id="pitch"></canvas>
        <button id="radar" type="button" hidden><span class="swap" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 6.5h12v3.5H3z"/><path d="M14.5 3l7 5.25-7 5.25z"/><path d="M9 14h12v3.5H9z"/><path d="M9.5 10.5l-7 5.25 7 5.25z"/></svg></span></button>
        <div id="scorebug" aria-live="off">
          <div class="sb-team sb-home"><span class="sb-chip"></span><span class="sb-name"></span></div>
          <div class="sb-score"><span class="sb-h">0</span><span class="sb-sep"></span><span class="sb-a">0</span></div>
          <div class="sb-team sb-away"><span class="sb-name"></span><span class="sb-chip"></span></div>
          <div class="sb-clock"><span class="sb-min"></span><span class="sb-period"></span></div>
        </div>
        <div id="overlay"></div>
        <div id="ai-off" data-i18n="aioff" hidden>AI off</div>
        <div id="replay-badge" role="status"></div>
        <div id="status" role="status"></div>
      </div>
    </div>
    <section id="activity" aria-label="Agent activity" data-i18n-aria="activity"></section>
    <div id="deck"></div>

    <div id="controls">
      <!-- the seek bar has its own row under the picture, the clock at its end, as in a video player -->
      <div id="seek-row">
        <div id="goals"></div>
        <div id="seek">
          <div id="seek-marks" aria-hidden="true"></div>
          <input id="seek-range" type="range" min="0" max="1" step="0.1" value="0" aria-label="Match time" data-i18n-aria="seek">
        </div>
        <span id="time" class="readout">0'</span>
      </div>
      <button id="play" class="ctl icon" type="button" aria-label="Play" data-i18n-aria="play" aria-keyshortcuts="Space">
        <!-- icons: one convex shape per path; Chromium on ANGLE over software Vulkan drops concave or multi-part paths (tests/web/voice.mjs) -->
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="i-play" d="M7 4.5v15l12-7.5z"/><path class="i-pause" d="M6 4.5h4.2v15H6z"/><path class="i-pause" d="M13.8 4.5H18v15h-4.2z"/></svg>
      </button>
      <div class="seg" role="group" aria-label="View" data-i18n-aria="view">
        <button class="ctl" type="button" data-view="2d" aria-pressed="true">2D</button>
        <button class="ctl" type="button" data-view="3d" aria-pressed="false">3D</button>
        <button class="ctl" type="button" data-view="split" aria-pressed="false">Radar</button>
      </div>
      <button id="voice" class="ctl" type="button" aria-label="AI voice-over" data-i18n-aria="voiceName" aria-pressed="false" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 9h4v6h-4z"/><path d="M7.5 9l5-4.5v15l-5-4.5z"/><path class="i-on" d="M14.5 8.5a4.5 4.5 0 0 1 0 7z"/><path class="i-on" d="M17.5 5.5a8 8 0 0 1 0 13z"/><path class="i-off" d="M14.6 9.4l1.4-1.4 6.6 6.6-1.4 1.4z"/><path class="i-off" d="M21.2 8l1.4 1.4-6.6 6.6-1.4-1.4z"/></svg>
        <span data-i18n="voice">Voice</span>
      </button>
      <button id="next-moment" class="ctl" type="button" aria-disabled="true">Next key moment</button>
      <!-- narrow screens: speed, audience and language behind one disclosure; wide screens show them in the row -->
      <button id="viewing-open" class="ctl" type="button" aria-expanded="false" aria-controls="viewing" data-i18n="viewing">Viewing</button>
      <div id="viewing">
        <div class="seg" role="group" aria-label="Playback speed" data-i18n-aria="speed">
          <button class="ctl" type="button" data-speed="1" aria-pressed="true">1x</button>
          <button class="ctl" type="button" data-speed="4">4x</button>
          <button class="ctl" type="button" data-speed="16">16x</button>
          <button class="ctl" type="button" data-speed="64">64x</button>
        </div>
        <button id="half2" class="ctl" type="button" data-i18n="half2">2nd half</button>
        <div class="seg" role="group" aria-label="Audience" data-i18n-aria="audience">
          <button class="ctl" type="button" data-audience="analyst" aria-pressed="true" data-i18n="analyst">Analyst</button>
          <button class="ctl" type="button" data-audience="casual" data-i18n="casual">Casual fan</button>
          <button class="ctl" type="button" data-audience="team" data-i18n="myteam" hidden>My team</button>
          <button class="ctl" type="button" data-audience="player" data-i18n="player" hidden>Player</button>
        </div>
        <select id="audience-pick" data-i18n-aria="pickteam" hidden></select>
        <label class="lang"><span class="sr" data-i18n="language">Language</span>
          <select id="lang"><option value="en">EN</option><option value="it">IT</option><option value="es">ES</option></select>
        </label>
      </div>
      <button id="ask-open" class="ctl" type="button" aria-controls="ask" aria-expanded="false" data-i18n="ask" hidden>Ask the studio</button>
      <button id="desk-open" class="ctl" type="button" aria-controls="desk" aria-expanded="false">Desk <span class="count"></span><span class="off" hidden>offline</span></button>
      <p id="view-status" role="status"></p>
      <p id="notice" role="alert" hidden></p>
      <p id="moments-live" class="sr" aria-live="polite"></p>
      <p id="ask-live" class="sr" aria-live="polite"></p>
    </div>
    <section id="ask" aria-labelledby="ask-title" hidden>
      <div class="ask-head"><h2 id="ask-title" data-i18n="ask">Ask the studio</h2>
        <button class="ctl ask-close" type="button" data-i18n="close">Close</button></div>
      <form>
        <label for="ask-q" data-i18n="askLabel">Your question about the match so far</label>
        <input id="ask-q" type="text" maxlength="280" required autocomplete="off" aria-describedby="ask-hint">
        <button class="ctl" type="submit" data-i18n="askSend">Ask</button>
      </form>
      <p id="ask-hint" data-i18n="askHint">Answers use only the match data up to the replay time.</p>
      <p id="ask-status" role="status"></p>
      <ol id="ask-log"></ol>
    </section>
  </main>
  <aside id="desk" aria-label="Control desk"></aside>
</body>
</html>
