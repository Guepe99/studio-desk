[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "studiodesk"
version = "0.1.0"
description = "AI production desk for a football broadcast, on synthetic match data"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "numpy==2.5.4",
  "fastapi==0.143.3",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "starlette==1.8.0",  # fastapi pulls it unpinned; the precompressed static files rely on its internals
  "azure-identity==1.26.0",
]

[project.optional-dependencies]
agents = [
  "agent-framework-core==1.22.0",
  "agent-framework-foundry==1.15.0",
  "agent-framework-openai==1.17.0",  # OpenAIChatClient for the Azure OpenAI v1 endpoint
  "agent-framework-orchestrations==1.3.2",
  "azure-monitor-opentelemetry==1.8.11",
  "mcp==1.30.0",  # agent-framework-core 1.22.0 needs mcp<2
]
dev = ["pytest==9.1.1", "mcp==1.30.0", "ruff==0.14.2"]  # mcp: tests/test_mcp.py, same pin as in agents

[tool.setuptools.packages.find]
include = ["studiodesk*"]

[tool.setuptools.package-data]
studiodesk = ["schema.sql", "**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # a worktree tests its own studiodesk, not the editable install

[tool.ruff]
line-length = 130
extend-exclude = ["web", "video", ".tts"]

[tool.ruff.lint]
ignore = ["E731"]  # small named lambdas are the house style

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811"]  # pytest fixtures imported from other test modules
